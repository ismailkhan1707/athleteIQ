{% extends 'base.html' %}

{% block title %}{{ 'Edit Sport' if sport else 'Add Sport' }} - AthleteIQ{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Edit Sport' if sport else 'Add Sport' }}</h1>
</div>

<div class="card form-card">
    <form method="POST">
        <div class="form-group">
            <label for="name" class="form-label">Sport Name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Enter sport name" value="{{ sport.name if sport else '' }}" required>
        </div>

        <div class="form-group">
            <label for="category" class="form-label">Category</label>
            <input type="text" id="category" name="category" class="form-input" placeholder="e.g., Team, Individual, Combat" value="{{ sport.category if sport else '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Update Sport' if sport else 'Add Sport' }}</button>
            <a href="{{ url_for('sports_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
